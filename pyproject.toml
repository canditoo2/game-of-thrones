[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agot"
version = "0.1.0"
description = "An AlphaZero-style neural agent for A Game of Thrones: The Board Game (2nd Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "canditoo2" }]
keywords = ["reinforcement-learning", "alphazero", "mcts", "board-game", "game-of-thrones"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The rules engine and MCTS deliberately depend only on numpy, so the whole
# project is usable without a GPU. PyTorch is an optional extra.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
rl = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agot = "agot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agot.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
