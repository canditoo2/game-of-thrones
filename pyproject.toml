[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "agot"
version = "0.1.0"
description = "An AlphaZero-style neural agent for A Game of Thrones: The Board Game (2nd Edition)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "canditoo2" }]
keywords = ["reinforcement-learning", "alphazero", "mcts", "board-game", "game-of-thrones"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The rules engine and search are the Rust extension built below; the Python
# layer only needs numpy. PyTorch is an optional extra.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
rl = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agot = "agot.cli:main"

# Mixed Rust/Python project: the abi3 extension (one wheel for Python >= 3.10)
# plus the Python package under src/. Building from source needs a Rust toolchain.
[tool.maturin]
manifest-path = "rust/crates/agot-py/Cargo.toml"
python-source = "src"
# The compiled extension lives inside the package; `agot_core_ext.py` re-exports
# it under the historical top-level name.
module-name = "agot._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
