name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  # The RL stack is checked separately so that a PyTorch wheel problem never
  # blocks the engine from being verified. The extension is built here too.
  test-with-torch:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rl]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Test (RL)
        run: pytest -q --no-header

  # The Rust engine: its own tests, its lint/format gates, then the whole Python
  # suite through the extension that the package build installs.
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before clippy: PyO3's build script probes the interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Lint
        working-directory: rust
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p agot-py --all-targets -- -D warnings

      - name: Test (engine)
        working-directory: rust
        run: cargo test --release

      - name: Build and inspect the wheel
        run: |
          pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          import glob, zipfile
          path = glob.glob("dist/agot-*.whl")[0]
          names = zipfile.ZipFile(path).namelist()
          assert any(name.startswith("agot/_core") for name in names), names
          assert "agot/data/map_base_6p.json" in names, names
          print("wheel ok:", path, len(names), "files")
          PY

      - name: Install the package (builds the extension)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rl]"

      - name: Test (Rust engine)
        run: pytest -q --no-header
